<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <title>Тапсырма 1: Интерфейс</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #fff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); max-width: 400px; width: 100%; text-align: center; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: #667eea; text-decoration: none; font-weight: 600; margin-bottom: 30px; float: left; }
        .clearfix { clear: both; }
        .welcome-msg { font-size: 2rem; font-weight: 700; color: #28a745; margin: 20px 0; animation: fadeIn 1s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Басты бет</a>
        <div class="clearfix"></div>
        <div class="welcome-msg">
            <i class="fa-solid fa-face-smile" style="display:block; font-size:3.5rem; margin-bottom:15px; color:#28a745;"></i>
            Қош келдіңіз!
        </div>
    </div>
    <script src="1.js"></script>
</body>
</html>
