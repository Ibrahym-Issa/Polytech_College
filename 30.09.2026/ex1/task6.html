<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <title>Тапсырма 6: Тапсырма қосу</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); max-width: 450px; width: 100%; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: #667eea; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
        .input-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border: 1px solid #e1e1e1; border-radius: 10px; font-size: 1rem; }
        button { padding: 12px 20px; border: none; border-radius: 10px; background: #667eea; color: white; font-weight: bold; cursor: pointer; }
        ul { list-style: none; max-height: 200px; overflow-y: auto; }
        li { padding: 12px; background: #f8f9fa; margin-bottom: 6px; border-radius: 8px; border-left: 4px solid #667eea; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Басты бет</a>
        <h2>Жылдам жазбалар</h2>
        <div class="input-box">
            <input type="text" id="task6Input" placeholder="Тапсырма мәтіні...">
            <button onclick="runTask6()"><i class="fa-solid fa-plus"></i> Қосу</button>
        </div>
        <ul id="task6List"></ul>
    </div>
    <script src="6.js"></script>
</body>
</html>
