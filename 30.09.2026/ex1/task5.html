<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <title>Тапсырма 5: Калькулятор</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* Общие красивые стили для страниц */
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); max-width: 450px; width: 100%; position: relative; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: #667eea; text-decoration: none; font-weight: 600; margin-bottom: 20px; transition: 0.2s; }
        .back-btn:hover { color: #764ba2; }
        h2 { margin-bottom: 20px; color: #333; font-size: 1.5rem; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #e1e1e1; border-radius: 10px; font-size: 1rem; transition: 0.3s; }
        input:focus { border-color: #667eea; outline: none; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        .btn-group { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 15px 0; }
        button { padding: 12px; border: none; border-radius: 10px; background: #667eea; color: white; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #556cd6; }
        .result-box { margin-top: 20px; padding: 15px; background: #f8f9fa; border-left: 4px solid #667eea; border-radius: 6px; font-size: 1.1rem; font-weight: 600; min-height: 54px; display: flex; align-items: center; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Басты бетке оралу</a>
        <h2><i class="fa-solid fa-calculator" style="color:#667eea;"></i> Калькулятор</h2>
        <input type="number" id="task5Num1" placeholder="Бірінші санды енгізіңіз">
        <input type="number" id="task5Num2" placeholder="Екінші санды енгізіңіз">
        <div class="btn-group">
            <button onclick="runTask5('+')"><i class="fa-solid fa-plus"></i> Қосу</button>
            <button onclick="runTask5('-')"><i class="fa-solid fa-minus"></i> Алу</button>
            <button onclick="runTask5('*')"><i class="fa-solid fa-xmark"></i> Көбейту</button>
            <button onclick="runTask5('/')"><i class="fa-solid fa-divide"></i> Бөлу</button>
        </div>
        <div class="result-box" id="task5Result">Нәтиже дайын емес...</div>
    </div>
    <script src="5.js"></script>
</body>
</html>
