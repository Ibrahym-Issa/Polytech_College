<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <title>Тапсырма 9: Динамикалық Таймер</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); max-width: 400px; width: 100%; text-align: center; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: #667eea; text-decoration: none; font-weight: 600; margin-bottom: 20px; float: left; }
        .clearfix { clear: both; }
        .timer-circle { width: 180px; height: 180px; border-radius: 50%; border: 6px solid #e1e1e1; margin: 20px auto; display: flex; justify-content: center; align-items: center; font-size: 2rem; font-weight: bold; color: #333; position: relative; transition: border-color 0.3s; }
        .timer-circle.running { border-color: #28a745; animation: pulse 2s infinite; }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        button { padding: 12px 20px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; color: white; }
        .btn-start { background: #28a745; }
        .btn-pause { background: #ffc107; color: #333; }
        .btn-reset { background: #dc3545; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(40, 167, 69, 0); } 100% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); } }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Артқа</a>
        <div class="clearfix"></div>
        <h2>Динамикалық Таймер</h2>
        <div class="timer-circle" id="timerCircle">00:00</div>
        <div class="btn-group">
            <button class="btn-start" onclick="startTimer()"><i class="fa-solid fa-play"></i> Қосу</button>
            <button class="btn-pause" onclick="pauseTimer()"><i class="fa-solid fa-pause"></i> Пауза</button>
            <button class="btn-reset" onclick="resetTimer()"><i class="fa-solid fa-rotate-left"></i> Тастау</button>
        </div>
    </div>
    <script src="9.js"></script>
</body>
</html>
