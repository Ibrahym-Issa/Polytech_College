<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <title>Тапсырма 8: Әріптер қалпы</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); max-width: 450px; width: 100%; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: #667eea; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #e1e1e1; border-radius: 10px; font-size: 1rem; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 10px; background: #667eea; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #556cd6; }
        .result-box { margin-top: 20px; padding: 15px; background: #f8f9fa; border-left: 4px solid #667eea; border-radius: 6px; font-size: 1.1rem; word-break: break-all; min-height: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> <-- </a>
        <h2>Регистрді өзгерту</h2>
        <input type="text" id="task8Input" placeholder="Мәтінді осында енгізіңіз...">
        <div class="btn-group">
            <button onclick="runTask8('upper')">ҮЛКЕН ӘРІПТЕР</button>
            <button onclick="runTask8('lower')">кіші әріптер</button>
        </div>
        <div class="result-box" id="task8Result">Нәтиже осында шығады...</div>
    </div>
    <script src="8.js"></script>
</body>
</html>
